name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange uploaded files
        run: |
          D=app/src/main/java/com/example/powerlocks
          R=app/src/main/res
          mkdir -p $D $R/values $R/drawable $R/mipmap-anydpi-v26 $R/xml
          # remove the template default robot launcher icons so they can never win
          rm -rf $R/mipmap-anydpi-v33
          rm -f $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          find $R -type f \( -name 'ic_launcher*.png' -o -name 'ic_launcher*.webp' \) -delete
          cp -f ./*.kt $D/ 2>/dev/null || true
          if [ -f AndroidManifest.xml ]; then cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          if [ -f service_config.xml ]; then cp -f service_config.xml $R/xml/service_config.xml; fi
          # the new app logo is created right here, so no extra upload is needed
          cat > $R/values/powerlock_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="powerlock_icon_bg">#F6F3EA</color>
          </resources>
          EOF
          cat > $R/mipmap-anydpi-v26/powerlock_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/powerlock_icon_bg" />
              <foreground android:drawable="@drawable/powerlock_icon_fg" />
          </adaptive-icon>
          EOF
          cat > $R/drawable/powerlock_icon_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1E9E68"
                  android:pathData="M54,28 L74,36 L74,53 C74,67 64,74.5 54,80 C44,74.5 34,67 34,53 L34,36 Z" />
              <path
                  android:fillColor="#F6F3EA"
                  android:pathData="M46.5,53 H61.5 A2.5,2.5 0 0,1 64,55.5 V65 A2.5,2.5 0 0,1 61.5,67.5 H46.5 A2.5,2.5 0 0,1 44,65 V55.5 A2.5,2.5 0 0,1 46.5,53 Z" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#F6F3EA"
                  android:strokeWidth="2.6"
                  android:strokeLineCap="round"
                  android:pathData="M48.5,53 V49.5 A5.5,5.5 0 0,1 59.5,49.5 V53" />
              <path
                  android:fillColor="#1E9E68"
                  android:pathData="M54,58.5 m-1.8,0 a1.8,1.8 0 1,0 3.6,0 a1.8,1.8 0 1,0 -3.6,0" />
          </vector>
          EOF
          ls -R app/src/main | head -60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: powerlocks-apk
          path: app/build/outputs/apk/debug/app-debug.apk
