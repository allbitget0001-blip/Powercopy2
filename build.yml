name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange uploaded files
        run: |
          D=app/src/main/java/com/example/powerlocks
          R=app/src/main/res
          mkdir -p $D $R/values $R/drawable $R/mipmap-anydpi-v26 $R/xml
          # remove the template's default robot launcher icons so they can never win
          rm -rf $R/mipmap-anydpi-v33
          rm -f $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          find $R -type f \( -name 'ic_launcher*.png' -o -name 'ic_launcher*.webp' \) -delete
          cp -f ./*.kt $D/ 2>/dev/null || true
          if [ -f AndroidManifest.xml ]; then cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          if [ -f service_config.xml ]; then cp -f service_config.xml $R/xml/service_config.xml; fi
          if [ -f powerlock_icon.xml ]; then cp -f powerlock_icon.xml $R/mipmap-anydpi-v26/powerlock_icon.xml; fi
          if [ -f powerlock_icon_fg.xml ]; then cp -f powerlock_icon_fg.xml $R/drawable/powerlock_icon_fg.xml; fi
          if [ -f powerlock_colors.xml ]; then cp -f powerlock_colors.xml $R/values/powerlock_colors.xml; fi
          ls -R app/src/main | head -60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: powerlocks-apk
          path: app/build/outputs/apk/debug/app-debug.apk
